# The other seed: a file where nearly every line is wrong in a different way,
# so the parser's warning paths are as reachable to a mutator as its accepting
# ones. Every line here must warn and none may abort (plans/08).
scrollback = 10
[general
[nosuchsection]
theme = dark
[general]
shel = /bin/sh
scrollback = -1
scrollback = 99999999999999999999
max-fps = 0
theme = chartreuse
on-exit =
clock = seconds extra
kill-grace-seconds = 601
prefix = C-
prefix =
= orphan
just-a-word
[terminal]
sixel-max-megapixels = 0
sixel-max-megapixels = 4097
sixel-max-megapixels = 64M
clipboard = exec:
clipboard = osc52,,pbcopy
clipboard = exec:printf '\#'
osc52 = yes
[printer]
ask-cache = 0K
spool-limit = 99G
save-format = pdf
save-folder =
[render]
max-fps = 30 # trailing comment
[keys]
bind
bind terminal
bind terminal d
bind nosuchcontext d detach
bind terminal C- detach
unbind
unbind terminal
bind terminal d no-such-action
