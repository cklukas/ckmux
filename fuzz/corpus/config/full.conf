# Every section and every key of config v1 (plans/08-configuration.md), each
# with a value the parser accepts. The seed a mutation starts from: a file that
# reaches every branch of the key table before a single byte is flipped.
[general]
prefix          = C-b
shell           = /bin/zsh
login-shell     = true
scrollback      = 10000
theme           = dark
on-exit         = hold-on-error
confirm-kill    = true
kill-empty-session = true
kill-grace-seconds = 5
clock           = seconds

[terminal]
term            = auto
mouse           = true
alternate-scroll= true
sixel           = auto
sixel-max-megapixels = 64
osc52           = true
clipboard       = osc52,pbcopy,exec:pbcopy -Prefer txt

[printer]
mode            = ask
ask-cache       = 256K
spool-limit     = 1M
save-format     = txt
save-folder     = ~/Documents
save-ask-name   = true

[render]
max-fps         = 30

[keys]
bind terminal d detach
bind terminal c new-terminal
bind desktop C-n new-terminal
unbind terminal q
