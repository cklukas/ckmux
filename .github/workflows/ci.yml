#
# Every gating lane builds ckmux against the PINNED ckVision release — the
# version stated once in CMakeLists.txt as CKMUX_CKVISION_VERSION, checked out
# here by its tag. That is exactly what an adopter's FetchContent build gets,
# so it is what the gate must test. One advisory lane builds against
# ckVision's published HEAD instead, as an early warning for the next ckVision
# release; it may fail without blocking anything.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            sanitize: ""
            ckvision_ref: pinned
            name: macos
          - os: macos-latest
            sanitize: "address,undefined"
            ckvision_ref: pinned
            name: macos-asan-ubsan
          - os: ubuntu-latest
            sanitize: ""
            ckvision_ref: pinned
            name: linux
          - os: ubuntu-latest
            sanitize: ""
            ckvision_ref: main
            name: linux-ckvision-head
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # Only the early-warning lane is advisory.
    continue-on-error: ${{ matrix.ckvision_ref == 'main' }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: ckmux

      - name: Resolve the ckVision ref
        id: ckvision
        run: |
          version=$(sed -n 's/^set(CKMUX_CKVISION_VERSION \([0-9.]*\))$/\1/p' ckmux/CMakeLists.txt)
          test -n "$version"
          if [ "${{ matrix.ckvision_ref }}" = "pinned" ]; then
            echo "ref=v$version" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ matrix.ckvision_ref }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out ckVision
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/ckVision
          ref: ${{ steps.ckvision.outputs.ref }}
          # While ckVision is private, the default GITHUB_TOKEN is scoped to
          # this repo only and cannot clone it; CKVISION_TOKEN is a
          # fine-grained PAT with read access. Once both repos are public this
          # line can go — and so could the whole step, since CMake's
          # FetchContent clones the tag itself; the explicit checkout stays
          # because it caches, authenticates properly, and names the ref in
          # the build log.
          token: ${{ secrets.CKVISION_TOKEN || github.token }}
          path: ckvision

      - name: Configure
        # FETCHCONTENT_SOURCE_DIR_CKVISION is CMake's standard "the sources
        # are already here" override for the ckvision FetchContent dependency;
        # the pinned version itself is stated only in CMakeLists.txt.
        run: >
          cmake -S ckmux -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DCKMUX_PREFER_CKVISION_SOURCE=OFF
          -DFETCHCONTENT_SOURCE_DIR_CKVISION=$GITHUB_WORKSPACE/ckvision
          -DCKMUX_SANITIZE=${{ matrix.sanitize }}

      # Warnings are errors in both projects, so a clean build is part of the
      # gate rather than something to read the log for.
      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure
